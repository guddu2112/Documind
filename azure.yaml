# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: documind
metadata:
  template: documind-accelerator

services:
  api:
    project: ./src
    language: python
    host: containerapp
    docker:
      path: ./Dockerfile
      context: .

infra:
  provider: terraform
  path: ./infra

pipeline:
  provider: github
