# yaml-language-server: $schema=https://raw.githubusercontent.com/Azure/azure-dev/main/schemas/v1.0/azure.yaml.json

name: documind
metadata:
  template: documind-accelerator

services:
  api:
    project: .
    language: python
    host: containerapp
    docker:
      path: ./Dockerfile
      context: .

infra:
  provider: terraform
  path: ./infra

hooks:
  # Build & push container image to ACR after infra is provisioned
  postprovision:
    posix:
      shell: sh
      run: ./hooks/postprovision.sh
      interactive: true
      continueOnError: false
    windows:
      shell: pwsh
      run: ./hooks/postprovision.ps1
      interactive: true
      continueOnError: false

pipeline:
  provider: github
